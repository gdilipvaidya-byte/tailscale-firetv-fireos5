
name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ts_ref: { type: string, default: '' }

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TS_REF: ${{ inputs.ts_ref }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
            [ -n "$files" ] || { echo "::error::no changed files listed for PR $PR"; exit 1; }
            printf '%s\n' "$files" | grep -vE '\.md$|^docs/' >/dev/null || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Tier 0 · static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: make check

  build:
    name: Tier 1 · build, NewApi lint, unit tests
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ inputs.ts_ref && 'drift' || 'tier1' }}
          save-sdk: 'true'

      - run: make build
        env: { LINT: '1', SKIP_TESTS: '0' }

      - name: Inspect Android application identifiers
        run: |
          set -euo pipefail

          echo "=== Locating downloaded Android source ==="
          GRADLE_FILE="$(find .build -path '*/android/build.gradle.kts' -print -quit)"
          test -n "$GRADLE_FILE"
          echo "Source file: $GRADLE_FILE"

          echo "=== Application ID and namespace ==="
          grep -nE 'applicationId|namespace' "$GRADLE_FILE" || true

          echo "=== Android manifest package declarations ==="
          find "$(dirname "$GRADLE_FILE")/src" -name AndroidManifest.xml \
            -exec grep -nE 'package=|BootReceiver|BOOT_COMPLETED' {} \; || true

      - name: Verify APK signature and boot receiver
        run: |
          set -euo pipefail

          echo "=== Checking BootReceiver patch ==="
          grep -R -n "BootReceiver" patches/

          APK="$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$SDK/build-tools/36.0.0"

          echo "=== APK signature ==="
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"

          echo "=== APK package details ==="
          "$TOOLS/aapt" dump badging "$APK" | head -n 8

          echo "=== Boot receiver and permissions ==="
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml \
            | grep -E "BootReceiver|BOOT_COMPLETED|RECEIVE_BOOT_COMPLETED"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-fireos5-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports
          path: .build/*/android/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: Tier 2 · API 22 emulator smoke tests
    needs: check
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: ./.github/actions/setup-build
        with:
          cache-key: emulator
          save: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - uses: ./.github/actions/setup-emulator
        with:
          save: ${{ github.event_name == 'push' }}

      - run: make build-emu emu-test

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emu-test-logs
          path: .build/emu-test/
          if-no-files-found: ignore
          retention-days: 14
